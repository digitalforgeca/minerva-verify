[package]
name = "minerva-verify"
version = "1.0.0"
edition = "2021"
authors = ["Digital Forge Studios <hello@dforge.ca>"]
description = "Standalone CLI verifier for Minerva ZK-STARK proofs — real cryptographic verification using Winterfell"
license = "MIT"
repository = "https://github.com/digitalforgeca/minerva-verify"
homepage = "https://zkesg.com"
keywords = ["zero-knowledge", "zk-stark", "verification", "cryptography", "privacy"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"

[[bin]]
name = "minerva-verify"
path = "src/main.rs"

[lib]
name = "minerva_verify"
path = "src/lib.rs"

[dependencies]
winterfell = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
base64 = "0.22"
sha2 = "0.10"
